name: Sync álbuns fotopix

# Disparo principal: cron-job.org (pontual), a cada 20 min das 07:00 às 10:40 e 17:00 às 20:40 (Fortaleza).
# O agendamento do GitHub abaixo fica só como reserva (costuma atrasar horas).
# Este workflow atualiza o linktree e, no fim, dispara o mesmo sync nos outros dois repositórios.
on:
  schedule:
    - cron: '7,27,47 10-13,20-23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fotopix
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar álbuns novos no fotopix
        run: node scripts/sync-fotopix.mjs linktree
      - name: Publicar (commit + push)
        run: |
          if git diff --quiet; then echo "Nada a publicar."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links-data.js index.html
          git commit -m "Auto-update $(TZ=America/Fortaleza date '+%d/%m/%Y %H:%M')"
          git pull --rebase
          git push

  disparar-outros-sites:
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar linktree-nicolabragafoto e linktree-fotopix
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "Segredo DISPATCH_TOKEN não configurado."; exit 1; fi
          gh workflow run sync-fotopix.yml -R nicolabraga/linktree-nicolabragafoto --ref main
          gh workflow run sync-fotopix.yml -R nicolabraga/linktree-fotopix --ref main
          echo "Os dois sites foram disparados."
